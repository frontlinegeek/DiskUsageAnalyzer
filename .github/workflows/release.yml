name: Build and publish release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-installer
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine application and SDK versions
        id: version
        shell: pwsh
        run: |
          $projectPath = 'src\DiskUsageAnalyzer.App\DiskUsageAnalyzer.App.csproj'
          [xml] $project = Get-Content -Raw -LiteralPath $projectPath

          $versionNodes = @($project.SelectNodes('/Project/PropertyGroup/Version'))
          if ($versionNodes.Count -ne 1) {
            throw "Expected exactly one Version in '$projectPath', found $($versionNodes.Count)."
          }

          $version = $versionNodes[0].InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Application Version '$version' in '$projectPath' must be a numeric version such as 1.2.3 or 1.2.3.4."
          }

          $frameworkNodes = @(
            $project.SelectNodes('/Project/PropertyGroup/TargetFramework')
            $project.SelectNodes('/Project/PropertyGroup/TargetFrameworks')
          )
          $frameworks = @(
            $frameworkNodes |
              ForEach-Object { $_.InnerText.Split(';') } |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
          )
          $sdkMajors = @(
            $frameworks |
              ForEach-Object {
                if ($_ -match '^net(?<major>\d+)\.\d+(?:-|$)') {
                  [int] $Matches.major
                }
              } |
              Sort-Object -Unique
          )

          if ($sdkMajors.Count -ne 1) {
            throw "Expected one .NET SDK major version in '$projectPath', found: $($sdkMajors -join ', ')."
          }

          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sdk_version=$($sdkMajors[0]).0.x" >> $env:GITHUB_OUTPUT
          Write-Host "Application version: $version"
          Write-Host "Release tag: $tag"

      - name: Fail if tag or release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" | Out-Null
          $tagLookupExitCode = $LASTEXITCODE

          if ($tagLookupExitCode -eq 0) {
            throw "Git tag '$env:RELEASE_TAG' already exists. Increment the application Version before publishing another release."
          }

          if ($tagLookupExitCode -ne 2) {
            throw "Unable to check whether Git tag '$env:RELEASE_TAG' exists (git exit code $tagLookupExitCode)."
          }

          $releaseLookup = gh api `
            -H 'Accept: application/vnd.github+json' `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>&1
          $releaseLookupExitCode = $LASTEXITCODE

          if ($releaseLookupExitCode -eq 0) {
            throw "GitHub Release '$env:RELEASE_TAG' already exists. Increment the application Version before publishing another release."
          }

          if (($releaseLookup | Out-String) -notmatch 'HTTP 404') {
            throw "Unable to check whether GitHub Release '$env:RELEASE_TAG' exists: $($releaseLookup | Out-String)"
          }

          exit 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.version.outputs.sdk_version }}

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build application and installer
        id: installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File '.\installer\Build-Installer.ps1' `
            -Version $env:APP_VERSION

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE."
          }

          $installerPath = Join-Path $PWD "artifacts\installer\DiskUsageAnalyzer-$env:APP_VERSION-win-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Expected installer was not created at '$installerPath'."
          }

          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT

      - name: Create and push Git tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag $env:RELEASE_TAG $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create Git tag '$env:RELEASE_TAG'."
          }

          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push Git tag '$env:RELEASE_TAG'. The tag may have been created concurrently."
          }

      - name: Create GitHub Release and attach installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_PATH: ${{ steps.installer.outputs.installer_path }}
        run: |
          gh release create $env:RELEASE_TAG $env:INSTALLER_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "Disk Usage Analyzer $env:APP_VERSION" `
            --generate-notes
